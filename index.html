<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
    <!-- Image Preloads -->
    <link rel="preload" as="image" href="./images/dev.webp" />
    <link rel="preload" as="image" href="./images/goat.webp" />
    <link rel="preload" as="image" href="./images/standup.webp" />
    <link rel="preload" as="image" href="./images/flowers.webp" />

    <!-- Audio Preload -->
    <link rel="preload" as="audio" href="./music/birthday.m4a" />
    <link rel="stylesheet" href="style.css" />
    <title>Happy Birthday Ghayas 🎂</title>
  </head>
  <body>
    <div class="main">
      <div class="header text_shadow">
        <h1>Today is Ghayas's Birthday 🎂</h1>
        <img id="ghayas_img" src="./images/Ghayas.jpeg" />
        <h2 id="bday_age">22 Years Old</h2>
        <h4 id="bday_date">22-03-2004</h4>
      </div>
      <div class="gift_section">
        <div>
          <h2 class="text_shadow">Here's how happy I'm for you today 🥳</h2>
          <h3 class="text_shadow">(Hover over the gifts)</h3>
          <div class="gift_row">
            <div id="gift_col">
              <!--First Gift-->
              <h4 class="gift_text">You are a good</h4>
              <div id="first_gift"></div>
            </div>
            <div id="gift_col">
              <!-- Second Gift -->
              <h4 class="gift_text">You are a</h4>
              <div id="second_gift"></div>
            </div>
            <div id="gift_col">
              <!-- Third Gift -->
              <h4 class="gift_text">You Walk In, Everyone</h4>
              <div id="third_gift"></div>
            </div>
            <div id="gift_col">
              <!-- Fourth Gift -->
              <h4 class="gift_text">For you</h4>
              <div id="fourth_gift"></div>
            </div>
          </div>
          <div class="music_gift">
            <div>
              <h4 class="gift_text">Here is a song for you</h4>
              <audio controls>
                <source src="./music/birthday.m4a#t=7" type="audio/mp4" />
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
